[project]
name = "equivariant-molecular-ml"
version = "0.1.0"
description = "E(n)-Equivariant Graph Neural Networks for molecular & protein ML."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "rdkit>=2023.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "pyyaml>6.0",
    "tqdm>4.66",
    "biopython>=1.87",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egnn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
