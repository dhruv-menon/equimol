[project]
name = "equivariant-molecular-ml"
version = "0.1.0"
description = "PyTorch building blocks for equivariant molecular and protein machine learning."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "rdkit>=2023.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "pyyaml>6.0",
    "tqdm>4.66",
    "biopython>=1.87",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equimol"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "attention: invariant edge attention and segmented softmax tests",
    "attentive_egnn: attention-augmented EGNN layer tests",
    "backbone: stacked EGNN backbone tests",
    "equivariance: translation, rotation, and permutation symmetry tests",
    "geometry: geometric utility tests",
    "graph: graph construction tests",
]
